[project]
name = "nokia-router-mcp"
version = "0.2.0"
description = "MCP server for Nokia WiFi Beacon / gateway routers (web_whw web UI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10,<2",
    "requests>=2.31",
    "cryptography>=42",
    "python-dotenv>=1.0",
]

[project.scripts]
nokia-router-mcp = "nokia_router_mcp.cli:main"

[project.urls]
Repository = "https://github.com/pbozzay/nokia-router-mcp"
Issues = "https://github.com/pbozzay/nokia-router-mcp/issues"
Changelog = "https://github.com/pbozzay/nokia-router-mcp/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nokia_router_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/scripts", "/docs", "/.github", "/.env.example", "/.gitignore",
    "/README.md", "/HANDOFF.md", "/SECURITY.md", "/CHANGELOG.md", "/pyproject.toml",
]
