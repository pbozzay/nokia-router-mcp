name: Tests and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e . build
      - name: Offline tests
        run: python -m unittest discover -v
      - name: Build source and wheel distributions
        run: python -m build
      - name: Inspect distribution contents
        run: python scripts/check_distribution.py
      - name: Install wheel
        shell: bash
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Discover tools from installed wheel outside checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/test_stdio.py" -v
